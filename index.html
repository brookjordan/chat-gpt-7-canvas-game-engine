<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Canvas Game Engine</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
        background: #eee;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <script>
      class GameEngine {
        constructor(width, height) {
          this.gameWidth = width;
          this.gameHeight = height;
          this.worldWidth = width * 2; // Larger world than the viewable area
          this.worldHeight = height * 2;
          this.canvas = document.getElementById("gameCanvas");
          this.ctx = this.canvas.getContext("2d");

          this.player = {
            x: width / 2,
            y: height / 2,
            size: 20,
            speed: 200, // pixels per second
            angle: 0, // Angle the player is facing
            velocity: { x: 0, y: 0 },
          };

          this.camera = { x: 0, y: 0, width: width, height: height };

          this.keys = { w: false, s: false, a: false, d: false };
          this.lastUpdateTime = 0;

          this.updateCanvasSize();

          window.addEventListener("resize", () => this.updateCanvasSize());
          window.addEventListener("keydown", (e) => this.handleKeyDown(e));
          window.addEventListener("keyup", (e) => this.handleKeyUp(e));

          this.startGameLoop();
        }

        updateCanvasSize() {
          // Resize the canvas to full window size
          this.canvas.width = window.innerWidth;
          this.canvas.height = window.innerHeight;

          this.scaleFactorX = this.canvas.width / this.gameWidth;
          this.scaleFactorY = this.canvas.height / this.gameHeight;
        }

        handleKeyDown(event) {
          if (event.key === "w") this.keys.w = true;
          if (event.key === "s") this.keys.s = true;
          if (event.key === "a") this.keys.a = true;
          if (event.key === "d") this.keys.d = true;
        }

        handleKeyUp(event) {
          if (event.key === "w") this.keys.w = false;
          if (event.key === "s") this.keys.s = false;
          if (event.key === "a") this.keys.a = false;
          if (event.key === "d") this.keys.d = false;
        }

        update(deltaTime) {
          let dirX = 0;
          let dirY = 0;

          if (this.keys.w) dirY = -1;
          if (this.keys.s) dirY = 1;
          if (this.keys.a) dirX = -1;
          if (this.keys.d) dirX = 1;

          // Normalize direction for diagonal movement and prevent faster diagonal speed
          const magnitude = Math.sqrt(dirX * dirX + dirY * dirY);
          if (magnitude > 0) {
            dirX /= magnitude;
            dirY /= magnitude;
          }

          // Set the velocity and angle based on movement
          this.player.velocity.x = dirX * this.player.speed;
          this.player.velocity.y = dirY * this.player.speed;

          if (dirX !== 0 || dirY !== 0) {
            this.player.angle = Math.atan2(dirY, dirX);
          }

          // Update player position based on velocity
          this.player.x += this.player.velocity.x * deltaTime;
          this.player.y += this.player.velocity.y * deltaTime;

          // Keep player inside the world bounds
          this.player.x = Math.max(0, Math.min(this.worldWidth, this.player.x));
          this.player.y = Math.max(
            0,
            Math.min(this.worldHeight, this.player.y)
          );

          // Update camera position to follow the player, keeping the player centered
          this.camera.x = Math.max(
            0,
            Math.min(
              this.worldWidth - this.camera.width,
              this.player.x - this.camera.width / 2
            )
          );
          this.camera.y = Math.max(
            0,
            Math.min(
              this.worldHeight - this.camera.height,
              this.player.y - this.camera.height / 2
            )
          );
        }

        drawCheckerboard() {
          const tileSize = 100;
          const scaledTileSizeX = tileSize * this.scaleFactorX;
          const scaledTileSizeY = tileSize * this.scaleFactorY;
          const startX =
            Math.floor(this.camera.x / scaledTileSizeX) * scaledTileSizeX;
          const startY =
            Math.floor(this.camera.y / scaledTileSizeY) * scaledTileSizeY;

          for (
            let y = startY;
            y < this.camera.y + this.camera.height;
            y += scaledTileSizeY
          ) {
            for (
              let x = startX;
              x < this.camera.x + this.camera.width;
              x += scaledTileSizeX
            ) {
              this.ctx.fillStyle =
                (x / scaledTileSizeX + y / scaledTileSizeY) % 2 === 0
                  ? "#ddd"
                  : "#999";
              this.ctx.fillRect(
                (x - this.camera.x) * this.scaleFactorX,
                (y - this.camera.y) * this.scaleFactorY,
                scaledTileSizeX,
                scaledTileSizeY
              );
            }
          }
        }

        drawPlayer() {
          const { x, y, size, angle } = this.player;

          this.ctx.save();
          this.ctx.translate(
            (this.player.x - this.camera.x) * this.scaleFactorX,
            (this.player.y - this.camera.y) * this.scaleFactorY
          );
          this.ctx.rotate(angle);
          this.ctx.fillStyle = "blue";
          this.ctx.fillRect(
            (-size / 2) * this.scaleFactorX,
            (-size / 2) * this.scaleFactorY,
            size * this.scaleFactorX,
            size * this.scaleFactorY
          );
          this.ctx.restore();
        }

        render() {
          // Clear canvas
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

          // Draw the checkerboard floor
          this.drawCheckerboard();

          // Draw the player
          this.drawPlayer();
        }

        startGameLoop() {
          const loop = (timestamp) => {
            const deltaTime = (timestamp - this.lastUpdateTime) / 1000;
            this.lastUpdateTime = timestamp;

            this.update(deltaTime);
            this.render();

            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
        }
      }

      // Initialize the game with width 800 and height 600 for the game world dimensions
      const game = new GameEngine(800, 600);
    </script>
  </body>
</html>
