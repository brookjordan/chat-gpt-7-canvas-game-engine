<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Canvas Game Engine</title>
    <style>
      body {
        margin: 0;
      }
      canvas {
        display: block;
        background: #eee;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <script>
      class GameEngine {
        constructor(width, height) {
          this.gameWidth = width;
          this.gameHeight = height;
          this.canvas = document.getElementById("gameCanvas");
          this.ctx = this.canvas.getContext("2d");

          this.player = {
            x: width / 2,
            y: height / 2,
            size: 20,
            speed: 200, // pixels per second
            angle: 0, // Angle the player is facing
            velocity: { x: 0, y: 0 },
          };

          this.keys = { w: false, s: false, a: false, d: false };
          this.lastUpdateTime = 0;

          this.scaleFactor = 1;
          this.updateCanvasSize();

          window.addEventListener("resize", () => this.updateCanvasSize());
          window.addEventListener("keydown", (e) => this.handleKeyDown(e));
          window.addEventListener("keyup", (e) => this.handleKeyUp(e));

          this.startGameLoop();
        }

        updateCanvasSize() {
          const aspectRatio = this.gameWidth / this.gameHeight;
          const windowAspect = window.innerWidth / window.innerHeight;

          if (windowAspect > aspectRatio) {
            // Window is wider than the game aspect ratio
            this.canvas.height = window.innerHeight;
            this.canvas.width = this.canvas.height * aspectRatio;
          } else {
            // Window is taller than the game aspect ratio
            this.canvas.width = window.innerWidth;
            this.canvas.height = this.canvas.width / aspectRatio;
          }

          this.scaleFactor = this.canvas.width / this.gameWidth;
        }

        handleKeyDown(event) {
          if (event.key === "w") this.keys.w = true;
          if (event.key === "s") this.keys.s = true;
          if (event.key === "a") this.keys.a = true;
          if (event.key === "d") this.keys.d = true;
        }

        handleKeyUp(event) {
          if (event.key === "w") this.keys.w = false;
          if (event.key === "s") this.keys.s = false;
          if (event.key === "a") this.keys.a = false;
          if (event.key === "d") this.keys.d = false;
        }

        update(deltaTime) {
          let dirX = 0;
          let dirY = 0;

          if (this.keys.w) dirY = -1;
          if (this.keys.s) dirY = 1;
          if (this.keys.a) dirX = -1;
          if (this.keys.d) dirX = 1;

          // Normalize direction for diagonal movement
          const magnitude = Math.sqrt(dirX * dirX + dirY * dirY);
          if (magnitude > 0) {
            dirX /= magnitude;
            dirY /= magnitude;
          }

          // Set the velocity and angle based on movement
          this.player.velocity.x = dirX * this.player.speed;
          this.player.velocity.y = dirY * this.player.speed;

          if (dirX !== 0 || dirY !== 0) {
            this.player.angle = Math.atan2(dirY, dirX);
          }

          // Update player position based on velocity
          this.player.x += this.player.velocity.x * deltaTime;
          this.player.y += this.player.velocity.y * deltaTime;

          // Prevent player from moving out of bounds
          this.player.x = Math.max(0, Math.min(this.gameWidth, this.player.x));
          this.player.y = Math.max(0, Math.min(this.gameHeight, this.player.y));
        }

        drawCheckerboard() {
          const tileSize = 50;
          const cols = Math.ceil(this.gameWidth / tileSize);
          const rows = Math.ceil(this.gameHeight / tileSize);

          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              this.ctx.fillStyle = (x + y) % 2 === 0 ? "#ddd" : "#999";
              this.ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
            }
          }
        }

        drawPlayer() {
          const { x, y, size, angle } = this.player;

          this.ctx.save();
          this.ctx.translate(x * this.scaleFactor, y * this.scaleFactor);
          this.ctx.rotate(angle);
          this.ctx.fillStyle = "blue";
          this.ctx.fillRect(
            (-size / 2) * this.scaleFactor,
            (-size / 2) * this.scaleFactor,
            size * this.scaleFactor,
            size * this.scaleFactor
          );
          this.ctx.restore();
        }

        render() {
          // Clear canvas
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

          // Draw the checkerboard floor
          this.drawCheckerboard();

          // Draw the player
          this.drawPlayer();
        }

        startGameLoop() {
          const loop = (timestamp) => {
            const deltaTime = (timestamp - this.lastUpdateTime) / 1000;
            this.lastUpdateTime = timestamp;

            this.update(deltaTime);
            this.render();

            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
        }
      }

      // Initialize the game with width 800 and height 600
      const game = new GameEngine(800, 600);
    </script>
  </body>
</html>
