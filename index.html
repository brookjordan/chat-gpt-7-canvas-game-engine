<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Canvas Game Engine</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
        background: #eee;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <script>
      class InputHandler {
        constructor() {
          this.keys = {};
          this.keyBindings = {};

          window.addEventListener("keydown", (e) => this.onKeyDown(e));
          window.addEventListener("keyup", (e) => this.onKeyUp(e));
        }

        onKeyDown(event) {
          const key = event.key.toLowerCase();
          if (!this.keys[key]) {
            this.keys[key] = true;
            if (this.keyBindings[key] && this.keyBindings[key].onPress) {
              this.keyBindings[key].onPress();
            }
          }
        }

        onKeyUp(event) {
          const key = event.key.toLowerCase();
          this.keys[key] = false;
          if (this.keyBindings[key] && this.keyBindings[key].onRelease) {
            this.keyBindings[key].onRelease();
          }
        }

        update() {
          // Loop through all registered keys and trigger onHold for active keys
          for (const key in this.keys) {
            if (
              this.keys[key] &&
              this.keyBindings[key] &&
              this.keyBindings[key].onHold
            ) {
              this.keyBindings[key].onHold();
            }
          }
        }

        // Method to bind actions to key press, hold, and release
        bindKey(key, { onPress, onHold, onRelease }) {
          this.keyBindings[key.toLowerCase()] = { onPress, onHold, onRelease };
        }
      }

      class GameEngine {
        constructor(width, height) {
          this.gameWidth = width;
          this.gameHeight = height;
          this.worldWidth = width * 2; // Larger world than the viewable area
          this.worldHeight = height * 2;
          this.canvas = document.getElementById("gameCanvas");
          this.ctx = this.canvas.getContext("2d");

          this.player = {
            x: width / 2,
            y: height / 2,
            size: 40,
            speed: 200, // pixels per second
            angle: 0, // Angle the player is facing
            velocity: { x: 0, y: 0 },
          };

          this.camera = {
            x: 0,
            y: 0,
            width: width,
            height: height,
            lagFactor: 0.1,
          };

          this.input = new InputHandler();
          this.lastUpdateTime = 0;

          this.scaleFactor = 1;

          this.spriteCanvas = document.createElement("canvas");
          this.spriteCanvas.width = this.player.size;
          this.spriteCanvas.height = this.player.size;
          this.spriteCtx = this.spriteCanvas.getContext("2d");
          this.generateWobblySprite();

          this.updateCanvasSize();

          window.addEventListener("resize", () => this.updateCanvasSize());

          // Bind movement keys (WASD) to player actions
          this.bindMovementKeys();

          this.startGameLoop();
        }

        updateCanvasSize() {
          // Resize the canvas to full window size
          this.canvas.width = window.innerWidth;
          this.canvas.height = window.innerHeight;

          // Uniform scale factor based on the smaller dimension (to maintain aspect ratio)
          this.scaleFactor = Math.min(
            this.canvas.width / this.gameWidth,
            this.canvas.height / this.gameHeight
          );
          this.camera.width = this.canvas.width / this.scaleFactor;
          this.camera.height = this.canvas.height / this.scaleFactor;
        }

        bindMovementKeys() {
          // W key (Move Up)
          this.input.bindKey("w", {
            onHold: () => this.movePlayer(0, -1),
          });

          // S key (Move Down)
          this.input.bindKey("s", {
            onHold: () => this.movePlayer(0, 1),
          });

          // A key (Move Left)
          this.input.bindKey("a", {
            onHold: () => this.movePlayer(-1, 0),
          });

          // D key (Move Right)
          this.input.bindKey("d", {
            onHold: () => this.movePlayer(1, 0),
          });
        }

        movePlayer(dirX, dirY) {
          // Normalize direction for diagonal movement
          const magnitude = Math.sqrt(dirX * dirX + dirY * dirY);
          if (magnitude > 0) {
            dirX /= magnitude;
            dirY /= magnitude;
          }

          // Set the velocity based on movement
          this.player.velocity.x = dirX * this.player.speed;
          this.player.velocity.y = dirY * this.player.speed;

          // Update player position based on velocity
          this.player.x += this.player.velocity.x / 60; // divide by 60 to approximate frame rate
          this.player.y += this.player.velocity.y / 60;

          // Keep player inside the world bounds
          this.player.x = Math.max(0, Math.min(this.worldWidth, this.player.x));
          this.player.y = Math.max(
            0,
            Math.min(this.worldHeight, this.player.y)
          );

          // Update player's angle based on direction
          if (dirX !== 0 || dirY !== 0) {
            this.player.angle = Math.atan2(dirY, dirX);
          }

          // Smooth camera follow with lag effect
          this.camera.x +=
            (this.player.x - this.camera.x - this.camera.width / 2) *
            this.camera.lagFactor;
          this.camera.y +=
            (this.player.y - this.camera.y - this.camera.height / 2) *
            this.camera.lagFactor;

          // Clamp camera within world bounds
          this.camera.x = Math.max(
            0,
            Math.min(this.worldWidth - this.camera.width, this.camera.x)
          );
          this.camera.y = Math.max(
            0,
            Math.min(this.worldHeight - this.camera.height, this.camera.y)
          );
        }

        drawCheckerboard() {
          const tileSize = 100;
          const startX = Math.floor(this.camera.x / tileSize) * tileSize;
          const startY = Math.floor(this.camera.y / tileSize) * tileSize;

          for (
            let y = startY;
            y < this.camera.y + this.camera.height;
            y += tileSize
          ) {
            for (
              let x = startX;
              x < this.camera.x + this.camera.width;
              x += tileSize
            ) {
              this.ctx.fillStyle =
                (x / tileSize + y / tileSize) % 2 === 0 ? "#ddd" : "#999";
              this.ctx.fillRect(
                (x - this.camera.x) * this.scaleFactor,
                (y - this.camera.y) * this.scaleFactor,
                tileSize * this.scaleFactor,
                tileSize * this.scaleFactor
              );
            }
          }
        }

        generateWobblySprite() {
          const ctx = this.spriteCtx;
          const size = this.player.size;
          let frame = 0;

          const draw = () => {
            ctx.clearRect(0, 0, size, size);
            ctx.fillStyle = "blue";

            const wobble = Math.sin(frame / 10) * 5;
            ctx.beginPath();
            ctx.ellipse(
              size / 2 + wobble,
              size / 2,
              size / 2,
              size / 2.2,
              0,
              0,
              Math.PI * 2
            );
            ctx.fill();

            frame++;
            requestAnimationFrame(draw);
          };

          draw();
        }

        drawPlayer() {
          const { x, y, size, angle } = this.player;

          this.ctx.save();
          this.ctx.translate(
            (this.player.x - this.camera.x) * this.scaleFactor,
            (this.player.y - this.camera.y) * this.scaleFactor
          );
          this.ctx.rotate(angle);

          // Draw wobbly sprite
          this.ctx.drawImage(
            this.spriteCanvas,
            (-size / 2) * this.scaleFactor,
            (-size / 2) * this.scaleFactor,
            size * this.scaleFactor,
            size * this.scaleFactor
          );

          this.ctx.restore();
        }

        render() {
          // Clear canvas
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

          // Draw the checkerboard floor
          this.drawCheckerboard();

          // Draw the player
          this.drawPlayer();
        }

        startGameLoop() {
          const loop = (timestamp) => {
            const deltaTime = (timestamp - this.lastUpdateTime) / 1000;
            this.lastUpdateTime = timestamp;

            this.input.update(); // Update input handler

            this.render();

            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
        }
      }

      // Initialize the game with width 800 and height 600 for the game world dimensions
      const game = new GameEngine(800, 600);
    </script>
  </body>
</html>
